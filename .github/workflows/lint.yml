name: Lint

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lint-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web (eslint / style / md / typecheck / prettier)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-node-npm

      - name: ESLint / Stylelint / Markdown
        run: npm run lint:js && npm run lint:style && npm run lint:md

      - name: Typecheck WebUI
        run: npm run typecheck:web

      - name: Prettier check
        run: npm run format:check

      - name: Commitlint (PR range)
        if: github.event_name == 'pull_request'
        run: |
          git fetch --no-tags origin \
            "${{ github.event.pull_request.base.sha }}" \
            "${{ github.event.pull_request.head.sha }}"
          npx commitlint \
            --from "${{ github.event.pull_request.base.sha }}" \
            --to "${{ github.event.pull_request.head.sha }}" \
            --verbose

  shell:
    name: Shell (shellcheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/setup-node-npm

      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends shellcheck

      - name: ShellCheck
        run: npm run lint:shell
        env:
          REQUIRE_SHELLCHECK: "1"

  tooling:
    name: Tooling (python / java / clang)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/setup-node-npm

      - name: Install ruff + clang-format
        run: |
          python3 -m pip install --user ruff
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang-format

      - name: Ruff (Python)
        run: npm run lint:py
        env:
          REQUIRE_RUFF: "1"

      - name: google-java-format (cbx509)
        run: npm run lint:java
        env:
          REQUIRE_JAVA_FORMAT: "1"

      - name: clang-format (native, if present)
        run: npm run lint:clang
        env:
          REQUIRE_CLANG_FORMAT: "1"

  lint:
    name: Lint gate
    runs-on: ubuntu-latest
    needs: [web, shell, tooling]
    if: always()
    steps:
      - name: Require all jobs success
        run: |
          echo "web=${{ needs.web.result }}"
          echo "shell=${{ needs.shell.result }}"
          echo "tooling=${{ needs.tooling.result }}"
          test "${{ needs.web.result }}" = "success"
          test "${{ needs.shell.result }}" = "success"
          test "${{ needs.tooling.result }}" = "success"
