name: Package Module

on:
  push:
    branches: [main, master]
    paths:
      - "webui/**"
      - "module/**"
      - "native/**"
      - "tooling/scripts/build-web.mjs"
      - "tooling/scripts/build-cbx509.mjs"
      - "tooling/scripts/build-zygisk-hide.mjs"
      - "tooling/scripts/package-module.mjs"
      - "tooling/scripts/lib/**"
      - "tooling/cbx509/**"
      - "package.json"
      - "package-lock.json"
      - ".github/actions/setup-node-npm/**"
      - ".github/workflows/package-module.yml"
  pull_request:
    branches: [main, master]
    paths:
      - "webui/**"
      - "module/**"
      - "native/**"
      - "tooling/scripts/build-web.mjs"
      - "tooling/scripts/build-cbx509.mjs"
      - "tooling/scripts/build-zygisk-hide.mjs"
      - "tooling/scripts/package-module.mjs"
      - "tooling/scripts/lib/**"
      - "tooling/cbx509/**"
      - "package.json"
      - "package-lock.json"
      - ".github/actions/setup-node-npm/**"
      - ".github/workflows/package-module.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package-module:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-node-npm

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r26d
          link-to-sdk: true

      - name: Build module zip
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          REQUIRE_ZYGISK_HIDE: "1"
          ZYGISK_ABIS: arm64-v8a,armeabi-v7a
        run: npm run build:module

      - uses: actions/upload-artifact@v4
        with:
          name: magisk-module
          path: release/*.zip
          if-no-files-found: error
