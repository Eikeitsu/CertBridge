name: Package Module

on:
  push:
    branches: [main, master]
    paths:
      - "module/**"
      - "webui/**"
      - "native/**"
      - "tooling/scripts/build-web.mjs"
      - "tooling/scripts/build-cbx509.mjs"
      - "tooling/scripts/build-zygisk-hide.mjs"
      - "tooling/scripts/package-module.mjs"
      - "tooling/scripts/stamp-ci-module-version.py"
      - "tooling/scripts/next-version-code.py"
      - "tooling/scripts/publish-ci-dist.sh"
      - "tooling/scripts/git-push-tree.sh"
      - "tooling/cbx509/**"
      - "package.json"
      - "package-lock.json"
      - ".github/actions/setup-node-npm/**"
      - ".github/workflows/package-module.yml"
  pull_request:
    branches: [main, master]
    paths:
      - "module/**"
      - "webui/**"
      - "native/**"
      - "tooling/scripts/build-web.mjs"
      - "tooling/scripts/build-cbx509.mjs"
      - "tooling/scripts/build-zygisk-hide.mjs"
      - "tooling/scripts/package-module.mjs"
      - "tooling/cbx509/**"
      - "package.json"
      - "package-lock.json"
      - ".github/actions/setup-node-npm/**"
      - ".github/workflows/package-module.yml"
  workflow_run:
    workflows: ["Build Web"]
    types: [completed]
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: package-module-${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
  cancel-in-progress: false

jobs:
  package-module:
    if: >
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - uses: ./.github/actions/setup-node-npm

      - name: Stamp CI module.prop
        if: github.event_name != 'pull_request'
        id: stamp
        run: |
          chmod +x tooling/scripts/*.sh || true
          eval "$(python3 tooling/scripts/stamp-ci-module-version.py --fetch-remote | tee /dev/stderr | grep -E '^(version|version_code)=')"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "version_code=$version_code" >> "$GITHUB_OUTPUT"
          cat module/module.prop

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r26d
          link-to-sdk: true

      - name: Build module zip
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          REQUIRE_ZYGISK_HIDE: "1"
          ZYGISK_ABIS: arm64-v8a,armeabi-v7a
        run: npm run build:module

      - uses: actions/upload-artifact@v4
        with:
          name: magisk-module
          path: release/*.zip
          if-no-files-found: error

      - name: Publish ci-dist (update.json + zips)
        if: >
          github.event_name != 'pull_request' &&
          ((github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')) ||
           (github.event_name == 'workflow_dispatch' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')) ||
           (github.event_name == 'workflow_run' &&
            (github.event.workflow_run.head_branch == 'main' || github.event.workflow_run.head_branch == 'master')))
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
        run: |
          chmod +x tooling/scripts/publish-ci-dist.sh tooling/scripts/git-push-tree.sh
          tooling/scripts/publish-ci-dist.sh "${{ steps.stamp.outputs.version }}"
