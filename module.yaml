# yaml-language-server: $schema=https://raw.githubusercontent.com/KernelSU-Modules/tools/main/schemas/module.schema.json
schemaVersion: 1
id: CertBridge
name: 证书桥
summary: 把 Reqable / ProxyPin / 自定义 PEM 注入系统信任库，兼容 Magisk、KernelSU、APatch。
description: README.zh-CN.md
license: MIT
homepage: https://eikeitsu.github.io/CertBridge/
support: https://github.com/Eikeitsu/CertBridge/issues
tags: [system, security, tools]
icon: module/icon.png
metamodule: false

authors:
  - name: 许小墨
    url: https://github.com/Eikeitsu

compatibility:
  androidMinApi: 24
  androidMaxApi: 36
  architectures: [arm64-v8a, armeabi-v7a, x86_64, x86]

# 正式 Release 含多个 zip（arm64 / arm32 / lite 等），必须用 pattern 只选一个
release:
  assetPattern: "CertBridge_*_arm64.zip"
