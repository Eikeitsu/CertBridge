# 证书桥配置
# 内置证书开关：1=启用 0=禁用
# mount_mode：compatible=完整兼容（默认，运行时 bind）| magic=轻量 Magic Mount（仅叠 addon）
# tmpfs_style：dev=/dev/.fs*（默认）| mnt=/mnt/.ca* | short=local/tmp .fs* | legacy=sys-ca-merge{,-hot}
# quiet_prop：1=module.prop 保持中性简介（默认，减少管理器列表指纹） 0=写入运行状态标签
# hot_allow：1=允许在 WebUI 手动发起临时挂载 0=禁用（不会自动扫目录挂载）
# hide_allow：仅在安装了挂载隐藏组件时存在；1=开启 try_umount 协助（安装后默认） 0=关闭
schema_version=4
reqable=1
proxypin=1
mount_mode=compatible
tmpfs_style=dev
quiet_prop=1
hot_allow=1
