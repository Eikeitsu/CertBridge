# 证书桥配置
# 内置证书开关：1=启用 0=禁用
# mount_mode：compatible=完整兼容（运行时整库 bind，不依赖元模块）| magic=轻量 Magic Mount（仅叠 addon，依赖管理器叠层）
#   Android 7–13：compatible bind system；magic 无脚本 bind
#   Android 14+：两模式均脚本 bind APEX；system 由 mount_mode 决定（compatible bind / magic 叠层），可被实验项关掉
# experimental_14_system：Android 14+ 对两种挂载模式均生效（7–13 忽略）；改后需重启
#   auto = 按 mount_mode 处理 system
#   skip = 默认：跳过 system，仅脚本 bind APEX（不 bind、不 Magic Mount）
# tmpfs_style：dev=/dev/.fs*（默认）| mnt=/mnt/.ca* | short=local/tmp .fs* | legacy=sys-ca-merge{,-hot}
# quiet_prop：1=module.prop 保持中性简介（默认，减少管理器列表指纹） 0=写入运行状态标签
# hot_allow：1=允许在 WebUI 手动发起临时挂载 0=禁用（不会自动扫目录挂载）
# hide_allow：仅在安装了挂载隐藏组件时由安装脚本写入；默认安装=0，自定义勾选隐藏=1；1=开启 try_umount
# force_bind_capture：1=命名空间注入时强注 Reqable/ProxyPin（旧行为，可盖掉「卸载模块」）0=默认尊重卸载
# late_inject：1=boot_completed 后 service 再跑 namespaces 注入（兼容难机）0=默认仅 boot 注入（痕迹更少）
schema_version=4
reqable=1
proxypin=1
mount_mode=compatible
experimental_14_system=skip
tmpfs_style=dev
quiet_prop=1
hot_allow=1
force_bind_capture=0
late_inject=0
