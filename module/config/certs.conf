# 证书桥配置
# 内置证书开关：1=启用 0=禁用
# mount_mode：compatible=完整兼容（默认，运行时 bind）| magic=轻量 Magic Mount（仅叠 addon）
# tmpfs_style：short=短路径 .fs0/.fs1（默认）| legacy=sys-ca-merge{,-hot}
# hot_allow：1=允许在 WebUI 手动发起临时挂载 0=禁用（不会自动扫目录挂载）
schema_version=3
reqable=1
proxypin=1
mount_mode=compatible
tmpfs_style=short
hot_allow=1
