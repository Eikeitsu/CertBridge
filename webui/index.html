<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1"
    />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#eef2f6" />
    <title>CertBridge</title>
    <style>
      html,
      body {
        margin: 0;
        min-height: 100%;
        background: #eef2f6;
        color: #1a2332;
        font-family:
          system-ui,
          -apple-system,
          "Segoe UI",
          sans-serif;
      }
      html[data-theme="dark"],
      html[data-theme="dark"] body {
        background: #0b1118;
        color: #e8eef6;
      }
      #root {
        margin: 0;
        min-height: 100%;
      }
      .cb-boot {
        box-sizing: border-box;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        min-height: 100vh;
        min-height: 100dvh;
        padding: 24px;
        text-align: center;
        user-select: none;
      }
      .cb-boot__brand {
        margin: 0;
        font-size: 1.375rem;
        font-weight: 650;
        letter-spacing: 0.04em;
        line-height: 1.2;
      }
      .cb-boot__bar {
        width: 42px;
        height: 2px;
        border-radius: 999px;
        background: rgba(120, 140, 160, 0.22);
        overflow: hidden;
        position: relative;
      }
      .cb-boot__bar::after {
        content: "";
        position: absolute;
        inset: 0 auto 0 0;
        width: 40%;
        border-radius: inherit;
        background: var(--bf-primary, #0d9488);
        animation: cb-boot-slide 1.05s ease-in-out infinite;
      }
      @keyframes cb-boot-slide {
        0% {
          transform: translateX(-120%);
        }
        100% {
          transform: translateX(320%);
        }
      }
    </style>
    <script>
      (function () {
        try {
          var root = document.documentElement;
          var read = function (key, fallback) {
            var value = localStorage.getItem(key);
            return value === null || value === "" ? fallback : value;
          };
          var pack = read("cb_theme_pack", "default");
          var legacy = {
            classic: "default",
            settings: "default",
            studio: "default",
            fluid: "default",
            material: "console",
            dense: "ops",
          };
          if (legacy[pack]) pack = legacy[pack];
          if (pack !== "default" && pack !== "console" && pack !== "ops")
            pack = "default";
          var mode = read("cb_theme_mode", "system");
          var prefersDark =
            !!window.matchMedia &&
            window.matchMedia("(prefers-color-scheme: dark)").matches;
          var dark = mode === "dark" || (mode !== "light" && prefersDark);
          root.dataset.theme = dark ? "dark" : "light";
          root.dataset.pack = pack;
          root.dataset.compact =
            read("cb_compact", pack === "console" || pack === "ops" ? "1" : "0") === "1"
              ? "1"
              : "0";
          var scale = parseFloat(read("cb_font_scale", "1"));
          root.style.setProperty("--bf-font-scale", String(scale > 0 ? scale : 1));
          var hex = /^#[0-9a-fA-F]{3,8}$/;
          var pick = read("cb_accent_color", "");
          var pair = read("cb_accent_pair", "");
          if (hex.test(pick)) {
            root.style.setProperty("--bf-accent-pick", pick);
            root.style.setProperty("--bf-primary", pick);
          }
          if (hex.test(pair)) root.style.setProperty("--bf-accent-pair", pair);
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute("content", dark ? "#0b1118" : "#eef2f6");

          var pref = read("cb_ui_lang", "system");
          var nav = (navigator.language || "en").toLowerCase();
          var lng =
            pref === "zh-CN" || pref === "zh"
              ? "zh-CN"
              : pref === "en"
                ? "en"
                : nav.indexOf("zh") === 0
                  ? "zh-CN"
                  : "en";
          root.lang = lng === "zh-CN" ? "zh-CN" : "en";
          var brand = lng === "zh-CN" ? "证书桥" : "CertBridge";
          document.title = brand;
          window.__CB_BOOT_BRAND__ = brand;
        } catch (error) {}
      })();
    </script>
  </head>
  <body>
    <div id="root">
      <div class="cb-boot" aria-busy="true" aria-live="polite" aria-label="Loading">
        <p class="cb-boot__brand" id="cb-boot-brand">CertBridge</p>
        <div class="cb-boot__bar" aria-hidden="true"></div>
      </div>
    </div>
    <script>
      (function () {
        try {
          var el = document.getElementById("cb-boot-brand");
          if (el && window.__CB_BOOT_BRAND__) el.textContent = window.__CB_BOOT_BRAND__;
        } catch (e) {}
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
