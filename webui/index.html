<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1"
    />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#eef2f6" />
    <title>证书桥</title>
    <!-- 关键首屏色：CSS 随 JS 模块加载前避免白闪 -->
    <style>
      html,
      body,
      #root {
        margin: 0;
        min-height: 100%;
        background: #eef2f6;
      }
      html[data-theme="dark"],
      html[data-theme="dark"] body,
      html[data-theme="dark"] #root {
        background: #0b1118;
        color: #e8eef6;
      }
      #root .cb-boot {
        box-sizing: border-box;
        min-height: 100vh;
        min-height: 100dvh;
      }
    </style>
    <script>
      (function () {
        try {
          var root = document.documentElement;
          var read = function (key, fallback) {
            var value = localStorage.getItem(key);
            return value === null || value === "" ? fallback : value;
          };
          var pack = read("cb_theme_pack", "default");
          var legacy = {
            classic: "default",
            settings: "default",
            studio: "default",
            fluid: "default",
            material: "console",
            dense: "ops",
          };
          if (legacy[pack]) pack = legacy[pack];
          if (pack !== "default" && pack !== "console" && pack !== "ops")
            pack = "default";
          var mode = read("cb_theme_mode", "system");
          var prefersDark =
            !!window.matchMedia &&
            window.matchMedia("(prefers-color-scheme: dark)").matches;
          var dark = mode === "dark" || (mode !== "light" && prefersDark);
          root.dataset.theme = dark ? "dark" : "light";
          root.dataset.pack = pack;
          root.dataset.compact =
            read("cb_compact", pack === "console" || pack === "ops" ? "1" : "0") === "1"
              ? "1"
              : "0";
          var scale = parseFloat(read("cb_font_scale", "1"));
          root.style.setProperty("--bf-font-scale", String(scale > 0 ? scale : 1));
          var hex = /^#[0-9a-fA-F]{3,8}$/;
          var pick = read("cb_accent_color", "");
          var pair = read("cb_accent_pair", "");
          if (hex.test(pick)) {
            root.style.setProperty("--bf-accent-pick", pick);
            root.style.setProperty("--bf-primary", pick);
          }
          if (hex.test(pair)) root.style.setProperty("--bf-accent-pair", pair);
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute("content", dark ? "#0b1118" : "#eef2f6");
        } catch (error) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"><div class="cb-boot" aria-busy="true"></div></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
